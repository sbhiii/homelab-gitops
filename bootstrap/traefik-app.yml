apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/SamyBahi/homelab-gitops.git"
    targetRevision: HEAD
    path: apps/traefik
  destination:
    server: "https://kubernetes.default.svc"
    namespace: traefik
  # --- LA CORRECTION EST ICI ---
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # Indique à ArgoCD de créer le namespace 'traefik'
