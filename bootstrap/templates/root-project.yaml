apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Homelab project"
  sourceRepos:
    - "https://github.com/SamyBahi/homelab-gitops.git"
    - "https://ghcr.io/*" # pour les OCI helm charts si besoin
    - "*" # ou ouvre tout si tu préfères
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
