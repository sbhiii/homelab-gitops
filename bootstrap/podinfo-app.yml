apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: "https://github.com/sbhiii/homelab-gitops.git"
    path: apps/podinfo
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
