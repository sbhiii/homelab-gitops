apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streaming
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SamyBahi/homelab-gitops.git
    targetRevision: HEAD
    path: apps/streaming
  destination:
    server: https://kubernetes.default.svc
    namespace: streaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
