# The admin password, so it survives a cluster rebuild instead of being
# regenerated. Set it once in Parameter Store and it is the same password on
# every fresh cluster.
#
# The value in SSM is the password itself. ArgoCD stores a bcrypt hash, so the
# template hashes it here; htpasswd returns "user:hash" and only the hash is
# wanted. The username in that call is irrelevant and discarded.
#
# The two policies do different jobs and are deliberately different values.
#
# creationPolicy: Merge means the operator writes into a Secret it does not own.
# argocd-secret is created by the Helm chart Terraform seeds and also holds
# server.secretkey, which signs every session token; owning it would drop that.
#
# mergePolicy: Replace means the rendered template is the operator's whole
# contribution. With Merge, the fetched value lands beside it and the password
# ends up in the Secret in the clear next to its own hash.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        admin.password: '{{ htpasswd "admin" .password "bcrypt" | trimPrefix "admin:" }}'
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/argocd/admin-password
