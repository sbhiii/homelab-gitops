# The admin password, so it survives a cluster rebuild instead of being
# regenerated. Set it once in Parameter Store and it is the same password on
# every fresh cluster.
#
# The value in SSM is the password itself. ArgoCD stores a bcrypt hash, so the
# template hashes it here; htpasswd returns "user:hash" and only the hash is
# wanted. The username in that call is irrelevant and discarded.
#
# creationPolicy and mergePolicy are BOTH Merge, deliberately. argocd-secret is
# created by the Helm chart Terraform seeds and also holds server.secretkey,
# which signs every session token. mergePolicy defaults to Replace, which would
# drop that key and lock everyone out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        admin.password: '{{ htpasswd "admin" .password "bcrypt" | trimPrefix "admin:" }}'
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/argocd/admin-password
