# Traefik expects htpasswd format in the "users" key. The value in SSM is the
# password itself; the template hashes it with bcrypt.
#
# Traefik cannot reference a Middleware across namespaces, so every namespace
# with an exposed Ingress carries its own copy of this and of the Middleware.
# They read the same parameter, so there is one password to remember.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: basic-auth
  namespace: podinfo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: basic-auth
    template:
      engineVersion: v2
      data:
        users: '{{ htpasswd "admin" .password "bcrypt" }}'
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/traefik/basicauth-password
