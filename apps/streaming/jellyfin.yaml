apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: streaming
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin
          ports:
            - containerPort: 8096
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
      volumes:
        - name: config
          hostPath:
            path: /var/lib/jellyfin/config
            type: DirectoryOrCreate
        - name: cache
          hostPath:
            path: /var/lib/jellyfin/cache
            type: DirectoryOrCreate
        - name: media
          hostPath:
            path: /var/mnt/streaming
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: streaming
spec:
  selector:
    app: jellyfin
  ports:
    - protocol: TCP
      port: 8096
      targetPort: 8096
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: streaming
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`jellyfin.local`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
