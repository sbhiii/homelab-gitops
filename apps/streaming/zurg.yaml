apiVersion: apps/v1
kind: Deployment
metadata:
  name: zurg
  namespace: streaming
  labels:
    app: zurg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zurg
  template:
    metadata:
      labels:
        app: zurg
    spec:
      containers:
        - name: zurg
          image: ghcr.io/debridmediamanager/zurg-testing:latest
          ports:
            - containerPort: 9999
              name: webdav
          env:
            - name: ZURG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: realdebrid-secret
                  key: token
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
      volumes:
        - name: config
          configMap:
            name: zurg-config
---
apiVersion: v1
kind: Service
metadata:
  name: zurg
  namespace: streaming
spec:
  selector:
    app: zurg
  ports:
    - protocol: TCP
      port: 9999
      targetPort: 9999
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zurg-config
  namespace: streaming
data:
  config.yml: |
    zurg: v1
    token: ${ZURG_TOKEN}
    directories:
      movies:
        group_order: 10
        group: media
        filters:
          - has_episodes: false
      shows:
        group_order: 20
        group: media
        filters:
          - has_episodes: true
