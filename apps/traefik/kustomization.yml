apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - networkpolicy.yml

helmCharts:
  - name: traefik
    releaseName: traefik
    version: 39.0.2
    repo: https://traefik.github.io/charts
    namespace: traefik
    includeCRDs: true
    valuesInline:
      api:
        # Not exposed through an Ingress, so unreachable from outside the
        # cluster:
        #   kubectl port-forward -n traefik deploy/traefik 8080:8080
        # insecure: true does leave the unauthenticated API on the Service,
        # so any pod can read it. See docs/security.md; that is a known gap.
        # Basic authentication came from a SealedSecret; sealed-secrets was
        # removed from the repository (upstream chart 404s, and no consumers
        # were left), pending the move to SSM Parameter Store.
        dashboard: true
        insecure: true
      ingressRoute:
        dashboard:
          enabled: false # no public exposure of the dashboard
      deployment:
        kind: Deployment
      # hostPort makes Traefik a singleton: only one pod can hold 80 and 443 on
      # the node. The chart's default RollingUpdate keeps the old pod until the
      # new one is Ready, and the new one can never become Ready because the old
      # one still holds the ports. The rollout deadlocks and stays Pending until
      # someone deletes the old pod by hand.
      #
      # Recreate stops the old pod first. That is a few seconds without ingress
      # on every Traefik change, which is the honest cost of one node and no
      # load balancer.
      updateStrategy:
        type: Recreate
      service:
        type: ClusterIP
      ports:
        web:
          hostPort: 80
          # Ingresses here bind to the websecure entrypoint only, so without
          # this, plain HTTP reaches Traefik and gets a 404 over an
          # unencrypted connection. A browser sent to the bare hostname tries
          # HTTP first and shows "Not secure", which looks like a broken
          # certificate and is not one.
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
                permanent: true
        websecure:
          hostPort: 443
        traefik:
          expose:
            default: true
      ingressClass:
        enabled: true
        isDefaultClass: true
