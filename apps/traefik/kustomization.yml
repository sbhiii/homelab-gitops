apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml

helmCharts:
  - name: traefik
    releaseName: traefik
    version: 39.0.2
    repo: https://traefik.github.io/charts
    namespace: traefik
    includeCRDs: true
    valuesInline:
      api:
        dashboard: true
        insecure: false # Fini les bugs de port 8080/9000

      # --- LA MAGIE EST ICI ---
      # Helm va créer la route automatiquement sur ton port 80
      ingressRoute:
        dashboard:
          enabled: true
          matchRule: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
          entryPoints:
            - web
      # ------------------------

      deployment:
        kind: Deployment
      service:
        type: ClusterIP
      ports:
        web:
          hostPort: 80
        websecure:
          hostPort: 443
      ingressClass:
        enabled: true
        isDefaultClass: true
