apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - networkpolicy.yml

helmCharts:
  - name: traefik
    releaseName: traefik
    version: 39.0.2
    repo: https://traefik.github.io/charts
    namespace: traefik
    includeCRDs: true
    valuesInline:
      api:
        # Dashboard accessible UNIQUEMENT via port-forward :
        #   kubectl port-forward -n traefik deploy/traefik 9000:9000
        # It is no longer exposed through an Ingress. Basic authentication came
        # from a SealedSecret; sealed-secrets was removed from the repository
        # (upstream chart 404s, and no consumers were left), pending the move to
        # SSM Parameter Store. Exposing the dashboard without authentication
        # would reveal every route and service in the cluster.
        dashboard: true
        insecure: true
      ingressRoute:
        dashboard:
          enabled: false # Pas d'exposition publique du dashboard
      deployment:
        kind: Deployment
      service:
        type: ClusterIP
      ports:
        web:
          hostPort: 80
        websecure:
          hostPort: 443
        traefik:
          expose:
            default: true
      ingressClass:
        enabled: true
        isDefaultClass: true
