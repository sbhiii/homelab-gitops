apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml

helmCharts:
  - name: traefik
    releaseName: traefik
    version: 39.0.2
    repo: https://traefik.github.io/charts
    namespace: traefik
    # C'est ici que tu personnalises Traefik sans toucher au code source
    valuesInline:
      additionalArguments:
        - "--api.insecure=true" # Active le dashboard sans authentification (pour le test)
        - "--api.dashboard=true"
      deployment:
        kind: Deployment
      service:
        type: ClusterIP # On n'utilise plus le type LoadBalancer ici
      ports:
        web:
          hostPort: 80 # <--- Magie : Lie le port 80 du container au port 80 du serveur
        websecure:
          hostPort: 443 # <--- Magie : Idem pour le 443
      ingressClass:
        enabled: true
        isDefaultClass: true
