apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - networkpolicy.yml

helmCharts:
  - name: traefik
    releaseName: traefik
    version: 39.0.2
    repo: https://traefik.github.io/charts
    namespace: traefik
    includeCRDs: true
    valuesInline:
      api:
        # Dashboard accessible UNIQUEMENT via port-forward :
        #   kubectl port-forward -n traefik deploy/traefik 9000:9000
        # Il n'est plus exposé par un Ingress. L'authentification basic passait
        # par un SealedSecret, or le contrôleur sealed-secrets n'est plus
        # installable (dépôt de chart en 404). Exposer le dashboard sans
        # authentification révélerait toutes les routes et services du cluster.
        dashboard: true
        insecure: true
      ingressRoute:
        dashboard:
          enabled: false # Pas d'exposition publique du dashboard
      deployment:
        kind: Deployment
      service:
        type: ClusterIP
      ports:
        web:
          hostPort: 80
        websecure:
          hostPort: 443
        traefik:
          expose:
            default: true
      ingressClass:
        enabled: true
        isDefaultClass: true
