apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - sealed-auth-secret.yml
  - middleware-auth.yml
  - ingress.yml # On utilise un Ingress standard, comme pour le reste !

helmCharts:
  - name: traefik
    releaseName: traefik
    version: 39.0.2
    repo: https://traefik.github.io/charts
    namespace: traefik
    includeCRDs: true
    valuesInline:
      api:
        dashboard: true
        insecure: false
      ingressRoute:
        dashboard:
          enabled: false # On désactive leur truc, on gère ça nous-mêmes
      deployment:
        kind: Deployment
      service:
        type: ClusterIP
      ports:
        web:
          hostPort: 80
        websecure:
          hostPort: 443
        traefik:
          expose: true # Indispensable : ouvre le port 9000 sur le Service K8s
      ingressClass:
        enabled: true
        isDefaultClass: true
