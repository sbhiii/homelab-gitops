# The basic-auth credential every exposed app sits behind.
#
# Traefik resolves a Middleware's basicAuth.secret in the Middleware's own
# namespace, and will not resolve a Middleware across namespaces, so every
# exposed namespace needs its own copy of the Secret. A ClusterExternalSecret
# projects one definition into each of them rather than duplicating the
# manifest per app.
#
# Namespaces are selected on kubernetes.io/metadata.name, a label the API server
# sets on every namespace, so nothing has to be labelled by hand and no Namespace
# manifest is needed for argocd, whose namespace this repo deliberately does not
# manage. Exposing a new app means adding its namespace to the list below.
#
# The value in Parameter Store is the password itself; htpasswd hashes it here.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: basic-auth
spec:
  externalSecretName: basic-auth
  refreshTime: 1h
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - argocd
            - podinfo
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: aws-parameter-store
      kind: ClusterSecretStore
    target:
      name: basic-auth
      template:
        engineVersion: v2
        data:
          users: '{{ htpasswd "admin" .password "bcrypt" }}'
    data:
      - secretKey: password
        remoteRef:
          key: /homelab/traefik/basicauth-password
