apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53
spec:
  acme:
    email: acme@alias.sbhi.io # Receives expiry notices
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-route53-account-key
    solvers:
      - dns01:
          route53:
            region: eu-west-1
            # Set explicitly: avoids needing route53:ListHostedZonesByName,
            # which takes no resource-level permissions and so cannot be
            # scoped to one zone.
            hostedZoneID: Z07358683H6SZYTME6GCG
