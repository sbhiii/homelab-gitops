apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53
spec:
  acme:
    email: ton-email@gmail.com # Reçoit les alertes d'expiration
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-route53-account-key
    solvers:
      - dns01:
          route53:
            region: eu-west-1 # Ou ta région AWS
            accessKeyID: AKIA_REDACTED # Ton ACCESS KEY ID (en clair)
            secretAccessKeySecretRef:
              name: aws-route53-credentials # Le nom du secret déchiffré par Sealed Secrets
              key: secret-access-key
