apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53
spec:
  acme:
    email: admin@example.com # Receives expiry notices
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-route53-account-key
    solvers:
      - dns01:
          route53:
            region: eu-west-1
            # Set explicitly: avoids needing route53:ListHostedZonesByName
            hostedZoneID: HOSTED_ZONE_ID
            role: arn:aws:iam::AWS_ACCOUNT_ID:role/cert-manager-route53
            auth:
              kubernetes:
                serviceAccountRef:
                  name: cert-manager
