apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  - namespace.yml
  - cluster-issuer.yml
  - rbac.yml

helmCharts:
  - name: cert-manager
    releaseName: cert-manager
    version: v1.19.4
    repo: https://charts.jetstack.io
    valuesInline:
      installCRDs: true # INDISPENSABLE : sans ça, les certificats ne marcheront jamais
