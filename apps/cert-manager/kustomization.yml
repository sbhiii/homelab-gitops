apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  - namespace.yml
  - cluster-issuer.yml
  - networkpolicy.yml

helmCharts:
  - name: cert-manager
    releaseName: cert-manager
    version: v1.19.4
    repo: https://charts.jetstack.io
    valuesInline:
      installCRDs: true # ESSENTIAL: without this, certificates will never work

      # Self-managed IRSA. The kubelet projects a ServiceAccount token whose
      # audience matches the aud condition on the IAM role's trust policy, and
      # the AWS SDK inside the controller exchanges it for credentials. This is
      # what EKS does natively, and it works for any AWS SDK workload rather
      # than only for cert-manager's own solver. See docs/security.md.
      volumes:
        - name: aws-web-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  # Must equal the aud condition on the role's trust policy.
                  audience: sts.amazonaws.com
      volumeMounts:
        - name: aws-web-identity-token
          mountPath: /var/run/secrets/sts.amazonaws.com/serviceaccount
          readOnly: true
      extraEnv:
        # From terraform output cert_manager_role_arn in homelab's iac/aws.
        # An account ID is not a secret, and this role is assumable only with a
        # token signed by this cluster's key and matching both trust policy
        # conditions.
        - name: AWS_ROLE_ARN
          value: arn:aws:iam::406169238804:role/cert-manager-route53
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: /var/run/secrets/sts.amazonaws.com/serviceaccount/token
        - name: AWS_REGION
          value: eu-west-1
