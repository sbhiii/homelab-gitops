# cert-manager exchanges a ServiceAccount token for temporary AWS credentials.
# Without this permission it cannot create that token.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-token-creator
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["cert-manager"]
    verbs: ["create"]
---
# Binds the permission above to the cert-manager ServiceAccount itself:
# without this binding, the Role alone grants nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-token-creator
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-token-creator
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
