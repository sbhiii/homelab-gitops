apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rclone-mount
  namespace: media
spec:
  selector:
    matchLabels:
      app: rclone-mount
  template:
    metadata:
      labels:
        app: rclone-mount
    spec:
      containers:
        - name: rclone
          image: rclone/rclone:latest
          securityContext:
            privileged: true
          command: ["rclone"]
          args:
            - "mount"
            - "zurg:"
            - "/mnt/realdebrid"
            - "--config=/etc/rclone/rclone.conf"
            - "--allow-other"
            - "--vfs-cache-mode=full"
            - "--vfs-cache-max-size=50G" # À ajuster selon l'espace SSD disponible sur ton nœud Hetzner
            - "--vfs-read-chunk-size=32M"
            - "--vfs-read-chunk-size-limit=2G"
            - "--dir-cache-time=10s"
            - "--log-level=INFO"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "umount -l /mnt/realdebrid || true"]
          volumeMounts:
            - name: config
              mountPath: /etc/rclone
            - name: media-mount
              mountPath: /mnt/realdebrid
              mountPropagation: Bidirectional
            - name: vfs-cache
              mountPath: /root/.cache/rclone
      volumes:
        - name: config
          configMap:
            name: rclone-config
        - name: media-mount
          hostPath:
            path: /mnt/realdebrid
            type: DirectoryOrCreate
        - name: vfs-cache
          hostPath:
            path: /var/cache/rclone
            type: DirectoryOrCreate
